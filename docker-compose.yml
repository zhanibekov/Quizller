version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    networks:
      - quizller-network

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quizller
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - quizller-network

networks:
  quizller-network:
    driver: bridge

volumes:
  db_data:
